server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100m;
    server_tokens off;

    # Files on the HDD, reachable only through the app's X-Accel-Redirect after it has
    # checked that the share exists, has not expired and the file is complete.
    location /_files/ {
        internal;
        alias /srv/xdrop/;
        sendfile on;
        aio threads;
        output_buffers 2 1m;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # stream chunks straight to the app
        proxy_buffering off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
